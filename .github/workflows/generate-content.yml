name: Generate BFE content batch

# On-demand trigger only. Go to the Actions tab and click "Run workflow."
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why generate now? (logged to job summary only)'
        required: false
        default: 'on-demand'

# Only one generation run at a time across all branches.
concurrency:
  group: generate-bfe-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate new batch + upload to R2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node tool/generate-content.mjs

      - name: Summary
        if: always()
        run: echo "Reason: ${{ inputs.reason }}" >> $GITHUB_STEP_SUMMARY
